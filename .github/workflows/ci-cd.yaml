name: Java CI/CD Pipeline to Docker Hub

on:
  push:
    branches: [ "main" ]

# 1. GitHub Actions కి గిట్‌హబ్‌లో మార్పులు పుష్ చేయడానికి పర్మిషన్ ఇవ్వడం
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: |
        mvn clean package -DskipTests

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: balu9963
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: balu9963/spring-app:${{ github.sha }}

    - name: Update Kubernetes Deployment Image
      run: |
        sed -i 's|image: balu9963/spring-app:.*|image: balu9963/spring-app:${{ github.sha }}|g' k8s/deployment.yaml

    - name: Commit and Push Image Tag Changes to GitHub
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git status
        git add k8s/deployment.yaml
        git commit -m "chore: update k8s deployment image tag to ${{ github.sha }}"
        git push
