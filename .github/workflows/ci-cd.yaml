name: Java CI/CD Pipeline to Docker Hub

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: |
        mvn clean package -DskipTests

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: balu9963
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image using standard docker commands
      run: |
        docker build -t balu9963/spring-app:${{ github.sha }} .
        docker push balu9963/spring-app:${{ github.sha }}

    - name: Update Kubernetes Deployment Image
      run: |
        sed -i 's|image: balu9963/spring-app:.*|image: balu9963/spring-app:${{ github.sha }}|g' k8s/deployment.yaml

    - name: Commit and Push Image Tag Changes to GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        
        # 1. లోకల్ అన్‌స్టేజ్డ్ చేంజెస్ ని తాత్కాలికంగా దాచుకోవడం
        git stash
        
        # 2. రిమోట్ నుండి లేటెస్ట్ కోడ్ తెచ్చుకుని రీబేస్ చేయడం
        git fetch origin main
        git rebase origin/main
        
        # 3. దాచుకున్న చేంజెస్ ని మళ్లీ వెనక్కి తెచ్చుకోవడం
        git stash pop || true
        
        # 4. యాడ్ చేసి కమిట్ & పుష్ చేయడం
        git add k8s/deployment.yaml
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update k8s deployment image tag to ${{ github.sha }}" && git push origin main)
