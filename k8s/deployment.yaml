apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:7f04bf1ab8823bf92f6913f6910058828fd16536
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
