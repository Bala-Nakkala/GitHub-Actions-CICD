apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:93a002355cdda151d96063989c3635935ed7ae3e
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
