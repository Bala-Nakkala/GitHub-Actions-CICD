apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:a9b15160cd54b43bb202ddc9897bc0a0a0642a6d
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
