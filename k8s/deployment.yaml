apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:3b5c4e1051128b5dfda6d238c470c02e0bf9b341
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
