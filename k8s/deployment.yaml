apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:e0a4a9c9b186204a073e543976fe286fef105744
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
