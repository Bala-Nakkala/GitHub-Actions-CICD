apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:2e7b301c96e2a0908d112d3d12a0f870f19c8882
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
