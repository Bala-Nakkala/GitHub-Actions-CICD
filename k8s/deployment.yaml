apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:5a2f263e8aba9410d6ad6954757df995e1d8eacc
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
