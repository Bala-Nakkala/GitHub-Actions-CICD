apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:787569e7ee795e9e01cf0ba7cb24fbfc0125f0b7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
