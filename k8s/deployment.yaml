apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:7b8eaea9a4f2e8cf2e85900a38f4597f875f0aee
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
