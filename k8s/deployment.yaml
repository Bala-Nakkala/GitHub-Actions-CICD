apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:e2a4068b7bfb65b8054cf0c14077d4cbac3596bb
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
