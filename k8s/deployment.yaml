apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:f71d79ce8321ea6eb5d2a0b512f02a61ddc90be9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
