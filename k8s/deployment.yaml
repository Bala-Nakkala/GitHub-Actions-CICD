apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:dc58fd6c19f526a9d2a3ea12059682cad7675524
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
