apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:b6f439c3b2c2c56f802e60d439da1bb4b63cf30c
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
