apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:b079e6253dbba203f906f5aa1d179b46d0f83182
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
