apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
  namespace: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:a99ffa078dd13bda65617fa100bde4a5bf74b236
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
