apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:2792330935b58686e4c422aaad1d9ac5d62ce590
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
