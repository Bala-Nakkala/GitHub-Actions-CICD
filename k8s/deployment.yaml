apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
      - name: spring-app
        image: balu9963/spring-app:482cc3ef4fd455653c93c69ff66b81c06d3e1e89
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
